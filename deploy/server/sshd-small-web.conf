# /etc/ssh/sshd_config.d/10-small-web.conf
# Keys only. root only from the admin box; the site user only through its forced command (authorized_keys).
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
AllowUsers root@ADMIN_IP site
AllowTcpForwarding no
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no
MaxAuthTries 3
LoginGraceTime 20

Match User site
	ForceCommand /usr/local/bin/site-deploy-ssh
	PermitTTY no
